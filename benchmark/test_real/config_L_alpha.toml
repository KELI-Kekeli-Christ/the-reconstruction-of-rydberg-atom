# ═══════════════════════════════════════════════════════════════
#  Config expériences L-variable + α·L
#
#  Éditer CE fichier avant de lancer, puis :
#    julia test_real/exp_L_alpha_full.jl
#    julia test_real/exp_L_alpha_xr.jl
#    julia test_real/exp_L_alpha.jl
#
#  Priorité : variables d'environnement > ce fichier
#  (utile sur Joyeux : deploy_*.sh peut encore surcharger)
# ═══════════════════════════════════════════════════════════════

[physics]
c6 = 1.0
dim = 2
z_min = 0.04          # seuil anti-collision pour generer_init
d_min = 0.04

[common]
n_instances = 5
l_init = 10.0         # L de départ / boîte de génération
l_chosen = 10.0       # L cible pour le scaling post-solve (full)
forms = ["Standard", "Simple", "Simple_square", "Taylor", "Taylor_square"]
zmin_match_tol = 0.2  # |dmin-zmin|/zmin < tol ⇒ "≈zmin ✓"
seed = 42

# ── exp_L_alpha_full.jl ───────────────────────────────────────
[full]
n_values = [4, 10, 20, 30, 40, 50]
alphas = [1.0e-6, 1.0e-4, 1.0e-2, 1.0, 5.0, 10.0]
run_exp1 = true       # Q aléatoire
run_exp2 = true       # Q synthétique exacte
run_exp3 = false      # Pasqal (.gml)
# Chemins relatifs à test_real/  (ou absolus)
out_dir = "results"
out_csv_name = "exp_L_alpha_full_results_n4_50.csv"
out_log_name = "exp_L_alpha_full_n4_50.log"
# pasqal_root = "../pasqal"   # décommenter pour forcer ; sinon défaut ../pasqal

# ── exp_L_alpha_xr.jl (export x* + paires) ────────────────────
[xr]
n_values = [4, 10]
alphas = [1.0e-6, 1.0e-4, 1.0e-2, 1.0]
out_dir = "results"
out_runs_name = "exp_L_alpha_xr_runs.csv"
out_pairs_name = "exp_L_alpha_xr_pairs.csv"
out_log_name = "exp_L_alpha_xr.log"

# ── exp_L_alpha.jl (script simple) ────────────────────────────
[simple]
n_values = [4, 10, 20, 30, 40, 50]
alphas = [1.0e-6, 1.0e-4, 1.0e-2, 1.0, 5.0, 10.0]
out_csv_name = "exp_L_alpha_results.csv"
